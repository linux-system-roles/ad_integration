# Code generated with ChatGPT using model Astra Light 6.
---
- name: Ensure SSSD configuration validation tools are installed
  package:
    name: sssd-tools
    state: present
    use: "{{ (__ad_integration_is_ostree | d(false)) |
      ternary('ansible.posix.rhel_rpm_ostree', omit) }}"
  when:
    - ad_integration_manage_packages | bool
    - ad_integration_validate_sssd_config | bool
    - ad_integration_client_software == 'sssd'
  register: __ad_integration_sssd_tools_register

- name: Handle reboot for transactional update systems
  include_tasks: transactional_reboot.yml
  vars:
    __ad_integration_tu_result: "{{ __ad_integration_sssd_tools_register }}"
    __ad_integration_tu_packages: [sssd-tools]
  when:
    - __ad_integration_is_transactional
    - __ad_integration_sssd_tools_register is not skipped

# realmd writes config_file_version, which sssctl rejects since SSSD 2.10
- name: Remove the obsolete config_file_version option
  lineinfile:
    path: "{{ __ad_integration_sssd_conf }}"
    regexp: '^\s*config_file_version\s*='
    state: absent
  when:
    - ad_integration_validate_sssd_config | bool
    - ad_integration_client_software == 'sssd'

- name: Check SSSD configuration
  command: sssctl config-check
  changed_when: false
  when:
    - ad_integration_validate_sssd_config | bool
    - ad_integration_client_software == 'sssd'
    - not ansible_check_mode
