# SPDX-License-Identifier: MIT
---
- name: Validate role parameters
  include_tasks: assert_role_vars.yml

- name: Set platform/version specific variables
  include_tasks: set_vars.yml

- name: Join Active Directory realm
  include_tasks: join.yml
  when: ad_integration_state == 'present'

- name: Leave Active Directory realm
  include_tasks: leave.yml
  when: ad_integration_state == 'absent'

- name: Record role success fingerprint
  sr_fingerprint:
    status: success
    role_name: ad_integration
    role_path: "{{ role_path }}"
    ansible_play_hosts_all: "{{ ansible_play_hosts_all }}"
    distribution: "{{ ansible_facts['distribution'] }}"
    distribution_version: "{{ ansible_facts['distribution_version'] }}"
    write_log_file: "{{ __ad_integration_write_log_file }}"
