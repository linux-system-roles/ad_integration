---
# Test helper (via include_role tasks_from): runs ini_file and asserts no change.

# python < 3.7: the latest community.general.ini_file needs python >= 3.7 to
# import, so use the vendored ini_file_python_36 copy.
- name: Check ini_file setting - python 3.6
  ini_file_python_36: "{{ __test_ini_file_args }}"  # noqa args[module]
  register: __result
  failed_when: __result is changed
  when:
    - not (ansible_facts['python_version'] is version('3.7', '>='))

# python >= 3.7: bare name, not FQCN, because an unresolvable FQCN aborts play
# parsing on ansible 2.9 even when skipped; resolves to community.general.ini_file.
# risky-file-permissions is suppressed because mode is hidden in the args dict.
- name: Check ini_file setting
  ini_file: "{{ __test_ini_file_args }}"  # noqa fqcn args[module] risky-file-permissions
  register: __result
  failed_when: __result is changed
  when:
    - ansible_facts['python_version'] is version('3.7', '>=')
