---

- name: Ensure that the role configures dynamic dns
  hosts: all,!ad
  vars:
    ad_integration_realm: sssd-custom-sample-realm.com
    __ad_integration_test_sssd_config_only: true
    ad_integration_sssd_custom_settings:
      - key: auth_provider_test
        value: ad
      - key: override_shell_test
        value: /bin/bash

  tasks:
    - name: Run test
      block:
        - name: Setup fake realm
          include_tasks: tasks/manage_fake_realm.yml
          vars:
            __manage_fake_realm: setup

        - name: Test - Run the system role with bogus vars
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            __sr_public: true

        # On managed nodes with python < 3.7, the latest community.general.ini_file
        # fails to import ("from __future__ import annotations" requires python
        # >= 3.7), so use the dependency-free vendored ini_file_python_36 module,
        # which works on every python/ansible combination.
        - name: Check custom SSSD settings - python 3.6
          ini_file_python_36:
            path: "{{ __ad_integration_sssd_conf }}"
            state: "{{ item.state | default('present') }}"
            section: domain/{{ ad_integration_realm }}
            option: "{{ item.key }}"
            value: "{{ item.value }}"
            create: true
            owner: root
            group: root
            mode: u=rw,g=,o=
          loop: "{{ ad_integration_sssd_custom_settings }}"
          register: __result
          failed_when: __result is changed
          when: not (ansible_facts['python_version'] is version('3.7', '>='))

        # Bare module name (not FQCN): on ansible 2.9 an unresolvable FQCN
        # aborts play parsing even for a task skipped by "when". The bare name
        # resolves to the ansible 2.9 builtin and redirects to the latest
        # collection module elsewhere. Used on managed nodes with python >= 3.7.
        - name: Check custom SSSD settings
          ini_file:  # noqa fqcn
            path: "{{ __ad_integration_sssd_conf }}"
            state: "{{ item.state | default('present') }}"
            section: domain/{{ ad_integration_realm }}
            option: "{{ item.key }}"
            value: "{{ item.value }}"
            create: true
            owner: root
            group: root
            mode: u=rw,g=,o=
          loop: "{{ ad_integration_sssd_custom_settings }}"
          register: __result
          failed_when: __result is changed
          when: ansible_facts['python_version'] is version('3.7', '>=')

        - name: Search /var/log/sssd/sssd.log for [sss_ini_call_validators]
          command: >-
            grep -i sss_ini_call_validators /var/log/sssd/sssd.log
          register: sssd_log
          changed_when: false
          failed_when: false

        - name: Fail if signature found
          fail:
            msg: Appears to be an unsupported option in /etc/sssd/sssd.conf
          when: sssd_log.stdout | length > 0

        - name: Test - Re-Build a list of settings with state=absent
          set_fact:
            update_list: "{{ ad_integration_sssd_custom_settings |
              map('combine', {'state': 'absent'}) | list }}"

        - name: Test - Re-run the system role to remove vars
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            ad_integration_sssd_custom_settings: "{{ update_list }}"

        # On managed nodes with python < 3.7, the latest community.general.ini_file
        # fails to import ("from __future__ import annotations" requires python
        # >= 3.7), so use the dependency-free vendored ini_file_python_36 module,
        # which works on every python/ansible combination.
        - name: Check custom SSSD settings after removing vars - python 3.6
          ini_file_python_36:
            path: "{{ __ad_integration_sssd_conf }}"
            state: "{{ item.state | default('present') }}"
            section: domain/{{ ad_integration_realm }}
            option: "{{ item.key }}"
            value: "{{ item.value }}"
            create: true
            owner: root
            group: root
            mode: u=rw,g=,o=
          loop: "{{ update_list }}"
          register: __result
          failed_when: __result is changed
          when: not (ansible_facts['python_version'] is version('3.7', '>='))

        # Bare module name (not FQCN): on ansible 2.9 an unresolvable FQCN
        # aborts play parsing even for a task skipped by "when". The bare name
        # resolves to the ansible 2.9 builtin and redirects to the latest
        # collection module elsewhere. Used on managed nodes with python >= 3.7.
        - name: Check custom SSSD settings after removing vars
          ini_file:  # noqa fqcn
            path: "{{ __ad_integration_sssd_conf }}"
            state: "{{ item.state | default('present') }}"
            section: domain/{{ ad_integration_realm }}
            option: "{{ item.key }}"
            value: "{{ item.value }}"
            create: true
            owner: root
            group: root
            mode: u=rw,g=,o=
          loop: "{{ update_list }}"
          register: __result
          failed_when: __result is changed
          when: ansible_facts['python_version'] is version('3.7', '>=')

      always:
        - name: Cleanup fake realm
          include_tasks: tasks/manage_fake_realm.yml
          vars:
            __manage_fake_realm: cleanup
