---
- name: Manage SSSD options in additional sections
  hosts: all,!ad
  vars:
    ad_integration_realm: SECTION.REALM.COM
    __realm_name_lower: "{{ ad_integration_realm | lower }}"
    ad_integration_validate_sssd_config: false
    __ad_integration_test_sssd_config_only: true
    ad_integration_sssd_settings:
      - key: reconnection_retries
        value: 5
    ad_integration_sssd_custom_settings:
      - key: override_shell
        value: /bin/bash
    ad_integration_sssd_section_settings:
      - section: nss
        key: filter_users
        value: root
      - section: pam
        key: offline_credentials_expiration
        value: 3
      - section: pam
        key: pam_verbosity
        state: absent
      - section: sssd
        key: reconnection_retries
        value: 7
      - section: domain/{{ __realm_name_lower }}
        key: override_shell
        value: /bin/zsh
  tasks:
    - name: Run section-aware settings test
      block:
        - name: Create temporary SSSD configuration
          tempfile:
            prefix: lsr_
            suffix: _ad_int.conf
          register: __sssd_conf_tmp

        - name: Use temporary SSSD configuration
          set_fact:
            __ad_integration_sssd_conf: "{{ __sssd_conf_tmp.path }}"

        - name: Seed SSSD configuration
          copy:
            dest: "{{ __ad_integration_sssd_conf }}"
            mode: "0600"
            content: |
              [sssd]
              services = nss, pam
              [nss]
              filter_users = olduser
              untouched_nss = keep
              [pam]
              pam_verbosity = 5
              [domain/{{ __realm_name_lower }}]
              existing_domain = keep
              [unrelated]
              unrelated_option = keep

        - name: Setup fake realm
          include_tasks: tasks/manage_fake_realm.yml
          vars:
            __manage_fake_realm: setup
            __ad_integration_realm_list: "domain-name: {{ ad_integration_realm }}"

        - name: Apply SSSD settings
          include_tasks: tasks/run_role_with_clear_facts.yml

        - name: Read updated SSSD configuration
          slurp:
            path: "{{ __ad_integration_sssd_conf }}"
          register: __sssd_config_first

        - name: Verify section settings and preserved options
          include_role:
            name: linux-system-roles.ad_integration
            tasks_from: include_check_ini_file.yml
          vars:
            __test_ini_file_args:
              path: "{{ __ad_integration_sssd_conf }}"
              section: "{{ item.section }}"
              option: "{{ item.key }}"
              value: "{{ item.value | default(omit) }}"
              state: "{{ item.state | default('present') }}"
              create: true
              owner: root
              group: root
              mode: u=rw,g=,o=
          loop:
            - {section: nss, key: filter_users, value: root}
            - {section: nss, key: untouched_nss, value: keep}
            - {section: pam, key: offline_credentials_expiration, value: '3'}
            - {section: pam, key: pam_verbosity, state: absent}
            - {section: sssd, key: reconnection_retries, value: '7'}
            - {section: sssd, key: services, value: 'nss, pam'}
            - {section: "domain/{{ __realm_name_lower }}", key: override_shell, value: /bin/zsh}
            - {section: "domain/{{ __realm_name_lower }}", key: existing_domain, value: keep}
            - {section: "domain/{{ ad_integration_realm }}", key: override_shell, value: /bin/bash}
            - {section: unrelated, key: unrelated_option, value: keep}

        - name: Apply SSSD settings again
          include_tasks: tasks/run_role_with_clear_facts.yml

        - name: Read SSSD configuration after second run
          slurp:
            path: "{{ __ad_integration_sssd_conf }}"
          register: __sssd_config_second

        - name: Verify configuration is unchanged on second run
          assert:
            that:
              - __sssd_config_second.content == __sssd_config_first.content

        - name: Remove NSS option with section-aware settings
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            ad_integration_sssd_section_settings:
              - section: nss
                key: filter_users
                state: absent

        - name: Verify option removal preserves remaining NSS settings
          include_role:
            name: linux-system-roles.ad_integration
            tasks_from: include_check_ini_file.yml
          vars:
            __test_ini_file_args:
              path: "{{ __ad_integration_sssd_conf }}"
              section: "{{ item.section }}"
              option: "{{ item.key }}"
              value: "{{ item.value | default(omit) }}"
              state: "{{ item.state | default('present') }}"
              create: true
              owner: root
              group: root
              mode: u=rw,g=,o=
          loop:
            - {section: nss, key: filter_users, state: absent}
            - {section: nss, key: untouched_nss, value: keep}
            - {section: unrelated, key: unrelated_option, value: keep}

      always:
        - name: Cleanup fake realm
          tags: tests::cleanup
          include_tasks: tasks/manage_fake_realm.yml
          vars:
            __manage_fake_realm: cleanup

        - name: Remove temporary SSSD configuration
          tags: tests::cleanup
          file:
            path: "{{ __sssd_conf_tmp.path }}"
            state: absent
          when: __sssd_conf_tmp.path is defined
