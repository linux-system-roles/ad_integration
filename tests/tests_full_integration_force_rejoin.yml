---

# To run this test properly AD (ad1) needs to be present in the inventory
# AD should be pre-configured as a dns for the client machine.
# Ansible collections ansible.windows and community.windows need to
#  be installed on client(s)

# Example inventory:
# [client]
# client1 ansible_connection=local ansible_host=127.0.0.1 \
#  ad_integration_realm="domain.com" ad_integration_password=Secret123
# [ad]
# ad1 ansible_host=<AD IP> ansible_connection=winrm ansible_password=Secret123\
#  ansible_port=5986 ansible_user=Administrator\
#  ansible_winrm_server_cert_validation=ignore

- name: Set variables
  hosts: client
  tasks:
    - name: Set ad_integration_realm if it is not defined or is empty
      set_fact:
        ad_integration_realm: domain.com
      when: ad_integration_realm is not defined or not ad_integration_realm
- name: Prepare user and groups on the AD
  hosts: ad
  tasks:
    - name: Create groups  # noqa syntax-check[unknown-module]
      microsoft.ad.group:
        name: "{{ item.name }}"
        state: present
        scope: "{{ item.scope }}"
      loop:
        - {name: 'test_grp0', scope: 'universal'}
        - {name: 'test_grp1', scope: 'universal'}
      register: group_creation
    - name: Debug group_creation
      debug:
        var: group_creation

    - name: Add a test user
      microsoft.ad.user:  # noqa syntax-check[unknown-module]
        identity: test_usr1
        firstname: Josef
        surname: Novak
        password: Secret123
        state: present
        groups:
          set:
            - test_grp1
      register: user_creation

    - name: Debug user_creation
      debug:
        var: user_creation

- name: Ensure that the role runs with real AD
  hosts: client
  tasks:
    - name: Run tests
      block:

        - name: Test run the system role
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            __sr_public: true
          register: role_run

        - name: Debug role_run
          debug:
            var: role_run

        - name: Restart sssd
          service:
            name: sssd
            state: restarted

        - name: Test sssd config contains the realm - before rejoin
          command: cat {{ __ad_integration_sssd_conf | quote }}
          register: sssd_config
          failed_when: ad_integration_realm not in sssd_config.stdout
          changed_when: false

        - name: Modify realmd config to detect rejoin
          lineinfile:
            path: /etc/realmd.conf
            line: "# Touched by a test"
          changed_when: false

        - name: Modify keytab to detect rejoin
          lineinfile:
            path: /etc/krb5.keytab
            line: "# Touched by a test"
          changed_when: false

        - name: Find the real realm command
          command: command -v realm
          register: __real_realm_cmd
          changed_when: false

        - name: Create temporary realm command wrapper directory
          tempfile:
            state: directory
            prefix: ad_rejoin_
          register: __realm_wrapper_tmp

        - name: Wrap realm to require the requested realm on leave
          copy:
            dest: "{{ __realm_wrapper_tmp.path }}/realm"
            mode: "0755"
            content: |
              #!/bin/sh
              if [ "$1" = "-v" ] && [ "$2" = "leave" ]; then
                  if [ "$#" -ne 3 ] || [ "$3" != {{ ad_integration_realm | quote }} ]; then
                      echo "realm leave must name ad_integration_realm" >&2
                      exit 99
                  fi
                  printf '%s\n' "$3" >> {{ (__realm_wrapper_tmp.path ~ '/leave_calls') | quote }}
              fi
              exec {{ __real_realm_cmd.stdout | quote }} "$@"

        - name: Use the checked realm command for the rest of the test
          set_fact:
            __ad_integration_realm_cmd: "{{ __realm_wrapper_tmp.path }}/realm"

        - name: Test run the system role with force rejoin
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            ad_integration_force_rejoin: true
          register: role_run_rejoin

        - name: Read rejoin leave calls
          slurp:
            src: "{{ __realm_wrapper_tmp.path }}/leave_calls"
          register: __rejoin_leave_calls

        - name: Assert rejoin left the requested realm explicitly
          assert:
            that:
              - (__rejoin_leave_calls.content | b64decode).splitlines() ==
                [ad_integration_realm]

        - name: Debug role_run_rejoin
          debug:
            var: role_run_rejoin

        # Realm join creates a new realmd.conf file so if the force rejoin
        # worked the file will not have the line inserted before.
        - name: Test realmd config is a new one from rejoin
          command: cat /etc/realmd.conf
          register: realmd_config_rejoined
          failed_when: '"# Touched by a test" in realmd_config_rejoined.stdout'
          changed_when: false

        - name: Test keytab is a new one from rejoin
          command: cat /etc/krb5.keytab
          register: keytab_rejoined
          failed_when: '"# Touched by a test" in keytab_rejoined.stdout'
          changed_when: false

        - name: Test sssd config contains the realm - after rejoin
          command: cat {{ __ad_integration_sssd_conf | quote }}
          register: sssd_config
          failed_when: ad_integration_realm not in sssd_config.stdout
          changed_when: false

        - name: Restart sssd
          service:
            name: sssd
            state: restarted

        - name: Test verify user is present
          command: getent passwd test_usr1@{{ ad_integration_realm }}
          changed_when: false

        - name: Test verify group is present
          command: getent group test_grp1@{{ ad_integration_realm }}
          changed_when: false

        - name: Create selected and neighboring SSSD cache test files
          copy:
            dest: "{{ __realm_wrapper_tmp.path }}/{{ item }}"
            content: test
            mode: "0600"
          loop:
            - "cache_{{ ad_integration_realm | lower }}.ldb"
            - "timestamps_{{ ad_integration_realm | lower }}.ldb"
            - "cache_neighbor.{{ ad_integration_realm | lower }}.ldb"

        - name: Leave the realm through the role
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            ad_integration_state: absent
            ad_integration_leave_remove_computer: false
            ad_integration_leave_reset_computer: false
            ad_integration_leave_sssd_cache_delete: true
            __ad_integration_sssd_db_dir: "{{ __realm_wrapper_tmp.path }}"

        - name: Check selected and neighboring SSSD cache test files
          stat:
            path: "{{ __realm_wrapper_tmp.path }}/{{ item }}"
          loop:
            - "cache_{{ ad_integration_realm | lower }}.ldb"
            - "timestamps_{{ ad_integration_realm | lower }}.ldb"
            - "cache_neighbor.{{ ad_integration_realm | lower }}.ldb"
          register: __rejoin_cache_after_leave

        - name: Gather SSSD service state after leave
          service_facts:

        - name: Record SSSD service state after leave
          set_fact:
            __rejoin_sssd_after_leave: >-
              {{ ansible_facts.services.get('sssd.service',
                 ansible_facts.services.get('sssd', {})).get('state', 'absent') }}

        - name: Assert targeted cache deletion and SSSD state restoration
          assert:
            that:
              - not __rejoin_cache_after_leave.results[0].stat.exists
              - not __rejoin_cache_after_leave.results[1].stat.exists
              - __rejoin_cache_after_leave.results[2].stat.exists
              - not __ad_integration_leave_sssd_running or
                __rejoin_sssd_after_leave == 'running'

        - name: List configured realms after leave
          command: realm list --name-only
          register: __realms_after_leave
          changed_when: false

        - name: Assert the requested realm is no longer configured
          assert:
            that:
              - ad_integration_realm | lower not in
                (__realms_after_leave.stdout_lines | map('lower') | list)

        - name: Repeat leave through the role
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            ad_integration_state: absent
            ad_integration_leave_sssd_cache_delete: true
            __ad_integration_sssd_db_dir: "{{ __realm_wrapper_tmp.path }}"

        - name: Gather SSSD service state after repeated leave
          service_facts:

        - name: Assert repeated leave skipped cache and service changes
          assert:
            that:
              - __ad_integration_leave_cache_files.results |
                selectattr('stat.exists') | list | length == 0
              - __ad_integration_leave_check_result is skipped
              - ansible_facts.services.get('sssd.service',
                ansible_facts.services.get('sssd', {})).get('state', 'absent') ==
                __rejoin_sssd_after_leave

        - name: Read all leave calls
          slurp:
            src: "{{ __realm_wrapper_tmp.path }}/leave_calls"
          register: __all_leave_calls

        - name: Assert repeated leave did not call realm again
          assert:
            that:
              - (__all_leave_calls.content | b64decode).splitlines() ==
                [ad_integration_realm, ad_integration_realm]

      always:
        - name: Teardown - Leave realm
          tags: tests::cleanup
          command: realm leave {{ ad_integration_realm | quote }}
          ignore_errors: true  # noqa ignore-errors
          changed_when: false

        - name: Remove temporary realm command wrapper
          tags: tests::cleanup
          file:
            path: "{{ __realm_wrapper_tmp.path }}"
            state: absent
          when: __realm_wrapper_tmp is defined
